<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>KittenRush</title>
    <script>
        // TODO 출시 후 실제 링크로 교체
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.kittenlab.kittenrush";
        const APP_STORE_URL = "https://apps.apple.com/app/id0000000000";
        const STEAM_URL = "https://store.steampowered.com/app/0000000/KittenRush/";

        const userAgent = navigator.userAgent;
        // iPadOS 13+ 는 UA 가 Mac 으로 위장하므로 터치 지원 여부로 보정
        const isIos = /iPad|iPhone|iPod/.test(userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/.test(userAgent);

        const targetUrl = isAndroid ? PLAY_STORE_URL : isIos ? APP_STORE_URL : STEAM_URL;
        // replace 는 히스토리를 남기지 않아 back 으로 이 페이지에 돌아올 수 없다
        location.replace(targetUrl);
    </script>
</head>
<body>
    <!-- JS 비활성/감지 실패 폴백 -->
    <noscript>
        <p><a href="https://play.google.com/store/apps/details?id=com.kittenlab.kittenrush">Google Play</a></p>
        <p><a href="https://apps.apple.com/app/id0000000000">App Store</a></p>
        <p><a href="https://store.steampowered.com/app/0000000/KittenRush/">Steam</a></p>
    </noscript>
</body>
</html>
