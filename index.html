<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>KittenRush</title>
    <!-- 링크 공유 시 메신저·SNS 가 읽는 미리보기 카드. 이 페이지는 즉시 redirect 하지만
         크롤러는 HTML 만 읽으므로 카드가 정상 표시된다. og:image 는 절대 URL 이어야 한다. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KittenLab">
    <meta property="og:title" content="KittenRush">
    <meta property="og:description" content="A pixel-art mini-game rush! 🐾">
    <meta property="og:url" content="https://kittenlab-dev.github.io/KittenRushDownload/">
    <meta property="og:image" content="https://kittenlab-dev.github.io/KittenRushDownload/og.png?v=20261106">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="KittenRush">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="KittenRush">
    <meta name="twitter:description" content="A pixel-art mini-game rush! 🐾">
    <meta name="twitter:image" content="https://kittenlab-dev.github.io/KittenRushDownload/og.png?v=20261106">
    <script>
        // Play 는 승인 후 자동 공개, App Store 는 심사 승인 시 이 ID 로 열린다.
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.kittenlab.kittenrush";
        const APP_STORE_URL = "https://apps.apple.com/app/id6804417576";
        const STEAM_URL = "https://store.steampowered.com/app/5174900/KittenRush/";

        const userAgent = navigator.userAgent;
        // iPadOS 13+ 는 UA 가 Mac 으로 위장하므로 터치 지원 여부로 보정
        const isIos = /iPad|iPhone|iPod/.test(userAgent)
            || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/.test(userAgent);

        const targetUrl = isAndroid ? PLAY_STORE_URL : isIos ? APP_STORE_URL : STEAM_URL;
        // replace 는 히스토리를 남기지 않아 back 으로 이 페이지에 돌아올 수 없다
        location.replace(targetUrl);
    </script>
</head>
<body>
    <!-- JS 비활성/감지 실패 폴백 -->
    <noscript>
        <p><a href="https://play.google.com/store/apps/details?id=com.kittenlab.kittenrush">Google Play</a></p>
        <p><a href="https://apps.apple.com/app/id6804417576">App Store</a></p>
        <p><a href="https://store.steampowered.com/app/5174900/KittenRush/">Steam</a></p>
    </noscript>
</body>
</html>
